<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Our Work | {{BRAND_NAME}}</title>
  <meta name="description" content="See {{BRAND_NAME}}'s completed projects in {{PRIMARY_CITY}} and surrounding areas." />
  <link rel="canonical" href="https://{{DOMAIN}}/pages/gallery" />
  <link rel="icon" href="/images/logos/favicon.ico" />
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root { --navy: {{NAVY}}; --gold: {{GOLD}}; --off-white: {{OFF_WHITE}}; --dark: #262626; --light-gray: #E5E3DF; }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Archivo', sans-serif; color: var(--dark); background: var(--off-white); }
    a { color: inherit; text-decoration: none; }
    .inner-nav { background: var(--navy); padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; }
    .inner-nav a { color: #fff; font-family: 'Archivo Black', sans-serif; font-size: 14px; text-transform: uppercase; letter-spacing: 1px; }
    .inner-nav .nav-cta { background: var(--gold); color: var(--navy); padding: 10px 20px; border-radius: 4px; font-size: 13px; }
    .blog-hero { padding: 100px 24px 60px; background: var(--navy); text-align: center; }
    .blog-hero h1 { font-family: 'Archivo Black', sans-serif; font-size: clamp(28px,5vw,42px); color: #fff; text-transform: uppercase; }
    .blog-hero p { color: rgba(255,255,255,0.7); font-size: 16px; margin-top: 12px; }    .gallery-grid { max-width: 1100px; margin: -30px auto 60px; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; padding: 0 24px; }
    .gallery-card { border-radius: 8px; overflow: hidden; background: #fff; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
    .gallery-card img { width: 100%; height: 220px; object-fit: cover; }
    .gallery-card .caption { padding: 14px 16px; font-size: 14px; color: #444; }
    .footer { background: var(--navy); color: rgba(255,255,255,0.7); padding: 40px 24px; text-align: center; font-size: 14px; }
    .footer a { color: var(--gold); }
  </style>
</head>
<body>
  <nav class="inner-nav">
    <a href="/">{{BRAND_NAME}}</a>
    <a href="/#heroForm" class="nav-cta">Free Estimate</a>
  </nav>

  <section class="blog-hero">
    <h1>Our Work</h1>
    <p>Recent projects from {{BRAND_NAME}}</p>
  </section>

  <div class="gallery-grid">
    <!-- Add gallery cards: -->
    <!-- <div class="gallery-card"><img src="/images/projects/project-name.webp" alt="Description" loading="lazy" /><div class="caption">Project description — City, State</div></div> -->
  </div>

  <footer class="footer">
    <p>&copy; {{YEAR}} {{LLC_NAME}}. All rights reserved. | <a href="/privacy">Privacy</a> | <a href="/terms">Terms</a></p>
  </footer>
  <script src="/global-modal.js" defer></script>
</body>
</html>
